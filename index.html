<!DOCTYPE html>
<html lang="en">
<head>

<title>Monkey Mowing — Highlands Ranch Lawn Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root {
  --forest-900: #082009;
  --forest-800: #0d2c12;
  --forest-700: #16401a;
  --forest-600: #1d5524;
  --forest-500: #2a6f2f;
  --lime-700:  #2f8a13;
  --lime-600:  #3f9e16;
  --lime-500:  #54be1f;
  --lime-400:  #74d83d;
  --lime-300:  #9ae86a;
  --lime-200:  #c5f3a3;
  --lime-100:  #e6f9d6;
  --cream:  #f5f9ee;
  --cream-2:#eef5e3;
  --paper:  #ffffff;
  --ink:    #122710;
  --ink-soft:#2c3d29;
  --muted:  #5d6e58;
  --line:   #e2ebd5;
  --sun:  #ffd23f;
  --sky:  #8fd0ff;
  --soil: #6b4a2b;
  --accent: var(--lime-500);
  --accent-deep: var(--lime-700);
  --font-display: 'Fredoka', sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
  --shadow-sm: 0 2px 8px rgba(16,44,18,.06);
  --shadow-md: 0 14px 34px -16px rgba(16,44,18,.28);
  --shadow-lg: 0 40px 80px -34px rgba(16,44,18,.42);
  --shadow-lime: 0 18px 40px -14px rgba(84,190,31,.55);
  --r-sm: 12px;
  --r-md: 20px;
  --r-lg: 30px;
  --r-xl: 44px;
  --maxw: 1200px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --ease-back: cubic-bezier(.34,1.56,.64,1);
}
[data-fonts="baloo"] { --font-display: 'Baloo 2', sans-serif; --font-body: 'DM Sans', system-ui, sans-serif; }
[data-fonts="grot"]  { --font-display: 'Bricolage Grotesque', sans-serif; --font-body: 'Plus Jakarta Sans', system-ui, sans-serif; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; line-height: 1.02; margin: 0; letter-spacing: -.01em; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img { display: block; max-width: 100%; }
.wrap { width: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 28px; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--font-body); font-weight: 700;
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent-deep);
}
.eyebrow::before { content: ""; width: 22px; height: 3px; border-radius: 3px; background: var(--accent); }
.section { padding: clamp(64px, 9vw, 120px) 0; position: relative; }
.section-head { max-width: 640px; margin-bottom: 52px; }
.section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
.section-head h2 { font-size: clamp(34px, 5vw, 58px); margin: 16px 0 0; }
.section-head p { margin-top: 18px; color: var(--muted); font-size: clamp(17px, 2vw, 20px); line-height: 1.55; }
.btn {
  --pad: 16px 28px;
  display: inline-flex; align-items: center; gap: 10px;
  padding: var(--pad);
  border-radius: 999px;
  font-family: var(--font-display); font-weight: 600;
  font-size: 17px; line-height: 1;
  transition: transform .35s var(--ease-back), box-shadow .35s var(--ease), background .25s;
  will-change: transform;
}
.btn svg { width: 19px; height: 19px; }
.btn-primary { background: var(--accent); color: var(--forest-900); box-shadow: var(--shadow-lime); }
.btn-primary:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 24px 46px -12px rgba(84,190,31,.7); }
.btn-dark { background: var(--forest-700); color: #fff; box-shadow: var(--shadow-md); }
.btn-dark:hover { transform: translateY(-3px); background: var(--forest-600); }
.btn-ghost { background: rgba(255,255,255,.7); color: var(--forest-700); border: 2px solid var(--line); }
.btn-ghost:hover { transform: translateY(-3px); border-color: var(--accent); background:#fff; }
.btn-lg { --pad: 19px 34px; font-size: 19px; }
.btn:active { transform: translateY(0) scale(.98); }
.reveal { opacity: 0; transform: translateY(34px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
.reveal-d1 { transition-delay: .08s; }
.reveal-d2 { transition-delay: .16s; }
.reveal-d3 { transition-delay: .24s; }
.reveal-d4 { transition-delay: .32s; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 60;
  transition: background .4s var(--ease), box-shadow .4s var(--ease), padding .4s var(--ease);
  padding: 18px 0;
}
.nav.scrolled { background: rgba(245,249,238,.86); backdrop-filter: blur(14px); box-shadow: 0 1px 0 var(--line); padding: 11px 0; }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.nav-logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.nav-logo img { height: 46px; width: auto; transition: height .4s var(--ease); }
.nav.scrolled .nav-logo img { height: 40px; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-links a {
  padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15.5px; color: var(--ink-soft);
  transition: background .2s, color .2s;
}
.nav-links a:hover { background: var(--lime-100); color: var(--forest-700); }
.nav-cta { display: flex; align-items: center; gap: 14px; }
.nav-phone { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--forest-700); font-size: 15.5px; }
.nav-phone svg { width: 17px; height: 17px; }
.nav-burger { display: none; width: 46px; height: 46px; border-radius: 14px; background: var(--forest-700); color:#fff; align-items: center; justify-content: center; }
@media (max-width: 940px) {
  .nav-links, .nav-phone { display: none; }
  .nav-burger { display: inline-flex; }
}
.msheet { position: fixed; inset: 0; z-index: 70; pointer-events: none; }
.msheet-bg { position: absolute; inset: 0; background: rgba(8,32,9,.4); opacity: 0; transition: opacity .35s; }
.msheet-panel { position: absolute; top: 0; right: 0; bottom: 0; width: min(82vw, 360px); background: var(--cream); transform: translateX(100%); transition: transform .4s var(--ease); padding: 24px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-lg); }
.msheet.open { pointer-events: auto; }
.msheet.open .msheet-bg { opacity: 1; }
.msheet.open .msheet-panel { transform: none; }
.msheet-panel a { padding: 14px 16px; border-radius: 14px; font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--forest-800); }
.msheet-panel a:hover { background: var(--lime-100); }
.msheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.hero { position: relative; min-height: 100svh; display: flex; align-items: center; overflow: hidden; padding-top: 92px; }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 40px; align-items: center; width: 100%; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 9px; padding: 8px 16px 8px 9px; border-radius: 999px;
  background: rgba(255,255,255,.7); border: 1px solid var(--line); font-weight: 700; font-size: 14px; color: var(--forest-700);
  box-shadow: var(--shadow-sm);
}
.hero-pill .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--forest-900); }
.hero-pill .dot svg { width: 14px; height: 14px; }
.hero h1 { font-size: clamp(44px, 7vw, 86px); line-height: .96; margin: 22px 0 0; letter-spacing: -.02em; }
.hero h1 .sweep { color: var(--accent-deep); position: relative; white-space: nowrap; }
.hero-sub { margin-top: 22px; font-size: clamp(18px, 2.1vw, 22px); line-height: 1.5; color: var(--ink-soft); max-width: 540px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }
.hero-trust { display: flex; flex-wrap: wrap; gap: 22px; margin-top: 34px; }
.hero-trust .t { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14.5px; color: var(--ink-soft); }
.hero-trust .t svg { width: 20px; height: 20px; color: var(--accent-deep); flex: none; }
.hero-switch { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 8; display: flex; gap: 7px; padding: 7px; background: rgba(255,255,255,.78); backdrop-filter: blur(10px); border-radius: 999px; box-shadow: var(--shadow-md); border: 1px solid var(--line); }
.hero-switch button { padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--muted); transition: .25s; display:flex; align-items:center; gap:7px; }
.hero-switch button .sw { width: 12px; height: 12px; border-radius: 50%; }
.hero-switch button.on { background: var(--forest-700); color: #fff; }
.hero-switch button:not(.on):hover { color: var(--forest-700); }
@media (max-width: 740px){ .hero-switch{ bottom: 14px; } .hero-switch button{ padding:7px 11px; font-size:12px; } }
.hero[data-hero="sunny"] { background:
  radial-gradient(1200px 600px at 78% -8%, #fff7d6 0%, rgba(255,247,214,0) 60%),
  linear-gradient(180deg, #f0f8e6 0%, #e7f4d6 55%, #def0c7 100%); }
.hero[data-hero="forest"] { background:
  radial-gradient(900px 520px at 80% 12%, #1d5524 0%, rgba(29,85,36,0) 62%),
  linear-gradient(165deg, #0d2c12 0%, #103016 60%, #0a2410 100%); }
.hero[data-hero="forest"] h1, .hero[data-hero="forest"] .hero-sub { color: #f4fbe9; }
.hero[data-hero="forest"] .hero-sub { color: #cfe6bd; }
.hero[data-hero="forest"] h1 .sweep { color: var(--lime-400); }
.hero[data-hero="forest"] .hero-pill { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); color:#eaf7d9; }
.hero[data-hero="forest"] .hero-trust .t { color:#cfe6bd; }
.hero[data-hero="forest"] .hero-trust .t svg { color: var(--lime-400); }
.hero[data-hero="forest"] .btn-ghost { background: rgba(255,255,255,.08); color:#fff; border-color: rgba(255,255,255,.2); }
.hero[data-hero="pattern"] { background: #f3f8ea; background-image:
  radial-gradient(circle at 1px 1px, rgba(84,190,31,.16) 2px, transparent 0);
  background-size: 30px 30px; }
.float { position: absolute; pointer-events: none; opacity: .9; will-change: transform; }
@keyframes bob { 0%,100%{ transform: translateY(0) rotate(var(--rot,0deg)); } 50%{ transform: translateY(-18px) rotate(var(--rot,0deg)); } }
.bob { animation: bob 6s ease-in-out infinite; }
.scene { position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 560px; margin-left: auto; }
.scene-card {
  position: absolute; inset: 0; border-radius: var(--r-xl);
  background: linear-gradient(180deg, #bfe89a 0%, #8fd566 100%);
  overflow: hidden; box-shadow: var(--shadow-lg);
  border: 1px solid rgba(255,255,255,.4);
}
.scene[data-hero="forest"] .scene-card { box-shadow: 0 50px 90px -30px rgba(0,0,0,.6); }
.scene-sky { position: absolute; top: 0; left: 0; right: 0; height: 42%; background: linear-gradient(180deg, #cdeeff 0%, #e8f7ff 100%); }
.scene-sun { position: absolute; top: 30px; right: 36px; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle, #ffe680 0%, #ffd23f 70%); box-shadow: 0 0 40px rgba(255,210,63,.7); }
.scene-cloud { position: absolute; height: 26px; border-radius: 999px; background: #fff; opacity: .92; }
.lawn { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; background: linear-gradient(180deg, #6cc63f 0%, #4fa82a 100%); overflow: hidden; }
.stripe { position: absolute; top: 0; bottom: 0; width: 12.5%; }
.stripe.dark { background: rgba(20,70,20,.10); }
.grass-row { position: absolute; left: 0; bottom: 0; height: 60%; width: 100%; display: flex; align-items: flex-end; }
.blade { flex: 1; margin: 0 .6px; background: linear-gradient(180deg, #3f9e16, #2f7d10); border-radius: 4px 4px 0 0; transition: height .25s var(--ease); transform-origin: bottom; }
.mower {
  position: absolute; bottom: 12%; width: 128px; z-index: 4;
  animation: mow 7s linear infinite;
}
.mower img { width: 100%; filter: drop-shadow(0 10px 12px rgba(0,0,0,.28)); }
@keyframes mow {
  0%   { left: -28%; transform: scaleX(1); }
  46%  { left: 92%;  transform: scaleX(1); }
  50%  { left: 92%;  transform: scaleX(-1); }
  96%  { left: -28%; transform: scaleX(-1); }
  100% { left: -28%; transform: scaleX(1); }
}
.clip { position: absolute; width: 7px; height: 7px; border-radius: 2px; background: #2f7d10; opacity: 0; }
@keyframes fly { 0%{ opacity:1; transform: translate(0,0) rotate(0); } 100%{ opacity: 0; transform: translate(var(--fx), var(--fy)) rotate(220deg); } }
.scene-chip {
  position: absolute; display: flex; align-items: center; gap: 10px;
  background: #fff; border-radius: 16px; padding: 11px 15px; box-shadow: var(--shadow-md);
  font-weight: 700; font-size: 14px; color: var(--forest-800);
}
.scene-chip .ic { width: 34px; height: 34px; border-radius: 11px; background: var(--lime-100); display: grid; place-items: center; color: var(--accent-deep); }
.scene-chip .ic svg { width: 19px; height: 19px; }
.scene-chip small { display: block; font-weight: 600; color: var(--muted); font-size: 11.5px; }
@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 30px; }
  .scene { max-width: 440px; margin: 0 auto; }
  .hero { min-height: auto; padding-bottom: 120px; }
}
.stats { background: var(--forest-700); color: #fff; }
.stats-inner { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 46px 0; }
.stat { text-align: center; position: relative; }
.stat:not(:last-child)::after { content:""; position:absolute; right: -10px; top: 14%; height: 72%; width:1px; background: rgba(255,255,255,.14); }
.stat .num { font-family: var(--font-display); font-weight: 700; font-size: clamp(38px, 5vw, 58px); color: var(--lime-400); line-height: 1; letter-spacing: -.02em; }
.stat .lbl { margin-top: 8px; font-weight: 600; color: #cfe6bd; font-size: 15px; }
@media (max-width: 720px){ .stats-inner{ grid-template-columns: 1fr 1fr; gap: 30px 20px; } .stat:nth-child(2)::after{ display:none; } }
.svc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
@media (max-width: 980px){ .svc-grid{ grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px){ .svc-grid{ grid-template-columns: 1fr; } }
.svc {
  position: relative; background: var(--paper); border-radius: var(--r-md); padding: 30px 26px 28px;
  border: 1px solid var(--line); overflow: hidden; cursor: pointer;
  transition: transform .45s var(--ease-back), box-shadow .45s var(--ease), border-color .3s;
}
.svc::before { content:""; position: absolute; inset: 0; background: linear-gradient(160deg, var(--forest-700), var(--forest-600)); opacity: 0; transition: opacity .4s var(--ease); z-index: 0; }
.svc > * { position: relative; z-index: 1; }
.svc:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); border-color: transparent; }
.svc:hover::before { opacity: 1; }
.svc-ic { width: 62px; height: 62px; border-radius: 18px; background: var(--lime-100); display: grid; place-items: center; color: var(--accent-deep); transition: .4s var(--ease-back); }
.svc-ic svg { width: 32px; height: 32px; }
.svc:hover .svc-ic { background: var(--lime-400); color: var(--forest-900); transform: rotate(-8deg) scale(1.08); }
.svc h3 { font-size: 23px; margin-top: 20px; transition: color .35s; }
.svc p { margin-top: 10px; color: var(--muted); font-size: 15px; line-height: 1.55; transition: color .35s; }
.svc .more { display: inline-flex; align-items: center; gap: 7px; margin-top: 18px; font-weight: 700; font-size: 14px; color: var(--accent-deep); transition: color .35s, gap .3s; }
.svc:hover h3, .svc:hover p { color: #fff; }
.svc:hover p { color: #d7ecc6; }
.svc:hover .more { color: var(--lime-300); gap: 12px; }
.svc-tag { position: absolute; top: 18px; right: 18px; z-index: 2; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--sun); color: #5a3d00; }
.est { background: linear-gradient(165deg, var(--forest-800), var(--forest-700) 60%, var(--forest-600)); color: #fff; border-radius: var(--r-xl); overflow: hidden; position: relative; }
.est-grid { display: grid; grid-template-columns: 1.1fr 1fr; }
.est-left { padding: clamp(36px, 5vw, 64px); }
.est-left h2 { font-size: clamp(30px, 4vw, 48px); color: #fff; }
.est-left .lead { margin-top: 16px; color: #cfe6bd; font-size: 18px; line-height: 1.5; }
.est-control { margin-top: 38px; }
.est-control .row { display: flex; justify-content: space-between; align-items: baseline; }
.est-control .row label { font-weight: 700; font-size: 15px; color: #eaf7d9; }
.est-control .row .val { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--lime-400); }
input[type="range"].slider { -webkit-appearance: none; appearance: none; width: 100%; height: 10px; border-radius: 999px; margin-top: 16px; background: rgba(255,255,255,.16); outline: none; }
input[type="range"].slider::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--lime-400); border: 4px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.35); cursor: grab; transition: transform .15s; }
input[type="range"].slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.12); }
input[type="range"].slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--lime-400); border: 4px solid #fff; cursor: grab; }
.est-ticks { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12.5px; color: #9fc488; font-weight: 600; }
.est-freq { display: flex; gap: 8px; margin-top: 30px; flex-wrap: wrap; }
.est-freq button { flex: 1; min-width: 90px; padding: 14px 10px; border-radius: 14px; background: rgba(255,255,255,.07); color: #eaf7d9; font-weight: 700; font-size: 14px; border: 1.5px solid rgba(255,255,255,.12); transition: .25s; }
.est-freq button small { display:block; font-weight:600; color:#9fc488; font-size:11.5px; margin-top:3px; }
.est-freq button.on { background: var(--lime-400); color: var(--forest-900); border-color: var(--lime-400); }
.est-freq button.on small { color: var(--forest-700); }
.est-right { background: rgba(0,0,0,.18); padding: clamp(34px, 4.5vw, 60px); display: flex; flex-direction: column; justify-content: center; position: relative; }
.est-quote-label { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: var(--lime-300); }
.est-price { font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; line-height: 1; margin-top: 12px; display: flex; align-items: baseline; gap: 6px; }
.est-price .amt { font-size: clamp(60px, 9vw, 92px); color: #fff; }
.est-price .per { font-size: 22px; color: #9fc488; font-weight: 600; }
.est-note { margin-top: 14px; color: #bcd9a8; font-size: 14.5px; line-height: 1.5; }
.est-breakdown { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
.est-breakdown .b { display: flex; justify-content: space-between; font-size: 14.5px; padding-bottom: 10px; border-bottom: 1px dashed rgba(255,255,255,.14); color: #d7ecc6; }
.est-breakdown .b b { color: #fff; font-weight: 700; }
.est .est-cta { margin-top: 28px; }
@media (max-width: 860px){ .est-grid{ grid-template-columns: 1fr; } }
.proc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; position: relative; }
@media (max-width: 980px){ .proc-grid{ grid-template-columns: 1fr 1fr; gap: 28px 20px; } }
@media (max-width: 520px){ .proc-grid{ grid-template-columns: 1fr; } }
.step { position: relative; padding-top: 14px; }
.step-num { font-family: var(--font-display); font-weight: 700; font-size: 70px; color: var(--lime-200); line-height: .8; letter-spacing: -.03em; }
.step-ic { position: absolute; top: 8px; left: 46px; width: 46px; height: 46px; border-radius: 14px; background: var(--forest-700); color: var(--lime-400); display: grid; place-items: center; box-shadow: var(--shadow-md); }
.step-ic svg { width: 24px; height: 24px; }

function useRevealObserver() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal:not(.in)');
    if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.14, rootMargin: '0px 0px -8% 0px' });
    els.forEach(e => io.observe(e));
    return () => io.disconnect();
  });
}

function CountUp({ to, suffix = '', prefix = '', dur = 1600, decimals = 0 }) {
  const ref = useRef(null);
  const [val, setVal] = useState(0);
  const done = useRef(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver((ents) => {
      ents.forEach(en => {
        if (en.isIntersecting && !done.current) {
          done.current = true;
          const start = performance.now();
          const tick = (now) => {
            const p = Math.min(1, (now - start) / dur);
            const eased = 1 - Math.pow(1 - p, 3);
            setVal(to * eased);
            if (p < 1) requestAnimationFrame(tick);
            else setVal(to);
          };
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.4 });
    io.observe(el);
    return () => io.disconnect();
  }, [to, dur]);
  const shown = decimals ? val.toFixed(decimals) : Math.round(val).toLocaleString();
  return <span ref={ref}>{prefix}{shown}{suffix}</span>;
}

const cx = (...a) => a.filter(Boolean).join(' ');

<script type="text/babel">
/* hero */
function parseHL(text) {
  const out = [];
  const re = /\*([^*]+)\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push({ t: text.slice(last, m.index), hl: false });
    out.push({ t: m[1], hl: true });
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push({ t: text.slice(last), hl: false });
  return out.length ? out : [{ t: text, hl: false }];
}

function MowerSVG() {
  return (
    <svg viewBox="0 0 150 120" width="100%" aria-hidden="true">
      <path d="M20 96 L70 40" stroke="#15401a" strokeWidth="7" strokeLinecap="round" fill="none"/>
      <path d="M16 92 L66 36" stroke="#15401a" strokeWidth="7" strokeLinecap="round" fill="none"/>
      <path d="M62 34 q8 -4 14 2" stroke="#15401a" strokeWidth="7" strokeLinecap="round" fill="none"/>
      <path d="M30 78 L18 60 q-6 -2 -8 6 l6 16 Z" fill="#2f7d10"/>
      <rect x="62" y="74" width="64" height="22" rx="7" fill="#15401a"/>
      <rect x="74" y="58" width="34" height="20" rx="5" fill="#1d5524"/>
      <rect x="80" y="62" width="22" height="8" rx="3" fill="#54be1f"/>
      <circle cx="74" cy="98" r="13" fill="#0d2c12"/><circle cx="74" cy="98" r="5" fill="#54be1f"/>
      <circle cx="116" cy="98" r="13" fill="#0d2c12"/><circle cx="116" cy="98" r="5" fill="#54be1f"/>
      <rect x="118" y="80" width="9" height="14" rx="3" fill="#15401a"/>
    </svg>
  );
}

function MowerScene({ dir, play }) {
  const bladesRef = useRef([]);
  const mowerRef = useRef(null);
  const rafRef = useRef(0);
  const N = 44;
  const reduced = typeof window !== 'undefined' && window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  useEffect(() => {
    if (reduced) {
      bladesRef.current.forEach(b => b && (b.style.height = (30 + Math.random()*20) + '%'));
      return;
    }
    const fullH = bladesRef.current.map(() => 62 + Math.random() * 36);
    const cur = fullH.slice();
    let x = -22;
    let d = 1;
    const speed = 0.42 * (play === 'bananas' ? 1.5 : play === 'chill' ? 0.7 : 1);
    let lastT = performance.now();
    const loop = (now) => {
      const dt = Math.min(40, now - lastT); lastT = now;
      x += d * speed * (dt / 16.7);
      if (x > 118) { x = 118; d = -1; }
      if (x < -22) { x = -22; d = 1; }
      if (mowerRef.current) {
        mowerRef.current.style.left = x + '%';
        mowerRef.current.style.transform = `scaleX(${d > 0 ? 1 : -1})`;
      }
      const cutFront = x + (d > 0 ? 4 : -4);
      for (let i = 0; i < N; i++) {
        const bx = (i / (N - 1)) * 100;
        cur[i] = Math.min(fullH[i], cur[i] + 0.18 * (dt / 16.7));
        if (d > 0 && bx <= cutFront && bx > cutFront - 7) cur[i] = 16 + Math.random()*6;
        if (d < 0 && bx >= cutFront && bx < cutFront + 7) cur[i] = 16 + Math.random()*6;
        const el = bladesRef.current[i];
        if (el) el.style.height = cur[i] + '%';
      }
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(rafRef.current);
  }, [play, reduced]);

  return (
    <div className="scene" data-hero={dir}>
      <div className="scene-card">
        <div className="scene-sky" />
        <div className="scene-sun bob" style={{ '--rot': '0deg' }} />
        <div className="scene-cloud" style={{ top: '14%', left: '12%', width: 64 }} />
        <div className="scene-cloud bob" style={{ top: '22%', left: '46%', width: 44, animationDelay: '1.2s' }} />
        <div className="lawn">
          {[1,2,3,4,5,6,7].map(i => (
            i % 2 ? <div key={i} className="stripe dark" style={{ left: (i*12.5)+'%' }} /> : null
          ))}
          <div className="grass-row">
            {Array.from({ length: N }).map((_, i) => (
              <div key={i} className="blade" ref={el => bladesRef.current[i] = el} style={{ height: '70%' }} />
            ))}
          </div>
          <div className="mower" ref={mowerRef} style={{ left: '-22%' }}>
            <MowerSVG />
          </div>
        </div>
      </div>
      <div className="scene-chip bob" style={{ top: '7%', left: '-7%', animationDelay: '.4s' }}>
        <div className="ic"><I.star /></div>
        <div><b>4.9 / 5</b><small>240+ happy lawns</small></div>
      </div>
      <div className="scene-chip bob" style={{ bottom: '8%', right: '-6%', animationDelay: '1.1s' }}>
        <div className="ic"><I.bolt /></div>
        <div><b>100% electric</b><small>quiet &amp; clean</small></div>
      </div>
    </div>
  );
}

function Hero({ dir, setDir, headline, play }) {
  const segs = parseHL(headline);
  const dirs = [
    { id: 'sunny', label: 'Sunny', c: '#74d83d' },
    { id: 'forest', label: 'Bold', c: '#103016' },
    { id: 'pattern', label: 'Playful', c: '#9ae86a' },

  const sub = "Mowing, fertilizing, mulching & seasonal snow removal across Highlands Ranch — handled by a crew that actually shows up. All-electric equipment. Always-free quotes.";
  return (
    <header className="hero" data-hero={dir} id="top">
      {play !== 'chill' && (
        <React.Fragment>
          <div className="float bob" style={{ top: '18%', left: '6%', '--rot': '-12deg', color: 'var(--lime-500)', animationDelay: '.2s' }}>
            <I.leaf style={{ width: 38, height: 38 }} />
          </div>
          <div className="float bob" style={{ top: '70%', left: '3%', '--rot': '14deg', color: 'var(--lime-400)', animationDelay: '1.4s' }}>
            <I.sparkle style={{ width: 26, height: 26 }} />
          </div>
          {play === 'bananas' && (
            <div className="float bob" style={{ top: '30%', right: '4%', '--rot': '8deg', color: 'var(--sun)', animationDelay: '.8s' }}>
              <I.sparkle style={{ width: 34, height: 34 }} />
            </div>
          )}
        </React.Fragment>
      )}
      <div className="wrap">
        <div className="hero-grid">
          <div className="hero-copy">
            <div className="hero-pill reveal in">
              <span className="dot"><I.pin /></span>
              Proudly serving Highlands Ranch &amp; nearby
            </div>
            <h1>{segs.map((s, i) => s.hl ? <span key={i} className="sweep">{s.t}</span> : <React.Fragment key={i}>{s.t}</React.Fragment>)}</h1>
            <p className="hero-sub">{sub}</p>
            <div className="hero-actions">
              <a className="btn btn-primary btn-lg" href="#quote">Get my free quote <I.arrow /></a>
              <a className="btn btn-ghost btn-lg" href="#estimator">Estimate my price</a>
            </div>
            <div className="hero-trust">
              <span className="t"><I.bolt /> 100% electric, eco-friendly</span>
              <span className="t"><I.leafCheck /> Always-free quotes</span>
              <span className="t"><I.heart /> Locally owned</span>
            </div>
          </div>
          <MowerScene dir={dir} play={play} />
        </div>
      </div>
      <div className="hero-switch" role="tablist" aria-label="Hero style">
        <span style={{ alignSelf: 'center', fontWeight: 700, fontSize: 12, color: 'var(--muted)', padding: '0 4px 0 8px' }}>Style</span>
        {dirs.map(d => (
          <button key={d.id} className={cx(dir === d.id && 'on')} onClick={() => setDir(d.id)}>
            <span className="sw" style={{ background: d.c }} /> {d.label}
          </button>
        ))}
      </div>
    </header>
  );
}
</script>

<script type="text/babel">
/* showcase */
function LawnArt({ variant }) {
  const after = variant === 'after';
  const stripes = [];
  for (let i = 0; i < 9; i++) {
    stripes.push(
      <rect key={i} x={-40 + i * 100} y="300" width="100" height="320"

    );
  }
  const patches = [];
  if (!after) {
    const spots = [[140,430,46],[330,520,60],[520,400,40],[650,500,54],[230,560,38],[430,440,30]];
    spots.forEach((s, i) => patches.push(<ellipse key={'p'+i} cx={s[0]} cy={s[1]} rx={s[2]} ry={s[2]*0.55} fill="#9a8a52" opacity=".7" />));
    const weeds = [[180,470],[400,540],[600,460],[300,420],[700,520]];
    weeds.forEach((w, i) => (
      patches.push(<g key={'w'+i} transform={`translate(${w[0]} ${w[1]})`}>
        <path d="M0 0 L-3 -26 M0 0 L0 -30 M0 0 L4 -24" stroke="#caa53e" strokeWidth="2.5" fill="none" strokeLinecap="round"/>
        <circle cx="0" cy="-30" r="5" fill="#ffd23f"/>
      </g>)
    ));
  }
  return (
    <svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style={{ display: 'block' }}>
      <defs>
        <linearGradient id={'sky'+variant} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={after ? '#bfe6ff' : '#cdd6da'} />
          <stop offset="1" stopColor={after ? '#eaf7ff' : '#e3e7e4'} />
        </linearGradient>
      </defs>
      <rect width="800" height="600" fill={`url(#sky${variant})`} />
      {after && <circle cx="660" cy="110" r="52" fill="#ffe27a" opacity=".9" />}
      <ellipse cx="120" cy="300" rx="90" ry="70" fill={after ? '#2f7d10' : '#5f6a3c'} />
      <ellipse cx="690" cy="290" rx="110" ry="80" fill={after ? '#357f12' : '#646f40'} />
      <g opacity={after ? .9 : .7}>

      <g style={{ clipPath: 'inset(300px 0 0 0)' }}>{stripes}</g>
      {patches}
      {!after && <path d="M0 305 q40 -14 80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 t80 0 V330 H0 Z" fill="#7a8a4a" opacity=".5" />}
    </svg>
  );
}

function BeforeAfter() {
  const [pct, setPct] = useState(52);
  const ref = useRef(null);
  const drag = useRef(false);
  const move = useCallback((clientX) => {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const p = Math.max(2, Math.min(98, ((clientX - r.left) / r.width) * 100));
    setPct(p);
  }, []);
  useEffect(() => {
    const onMove = (e) => { if (!drag.current) return; move(e.touches ? e.touches[0].clientX : e.clientX); };
    const onUp = () => { drag.current = false; };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('mouseup', onUp);
    window.addEventListener('touchend', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('touchmove', onMove);
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchend', onUp);
    };
  }, [move]);
  const start = (e) => { drag.current = true; move(e.touches ? e.touches[0].clientX : e.clientX); };
  return (
    <section className="section bg-soft" id="gallery">
      <div className="wrap">
        <div className="ba-wrap">
          <div className="reveal">
            <span className="eyebrow">See the difference</span>
            <h2 style={{ fontSize: 'clamp(32px,4.6vw,52px)', marginTop: 16 }}>Drag to watch the<br/>jungle become a lawn.</h2>
            <p style={{ marginTop: 18, color: 'var(--muted)', fontSize: 19, lineHeight: 1.55, maxWidth: 420 }}>
              Tired, patchy and overgrown on the left. Thick, striped and edge-perfect on the right. Same yard — one visit from the Monkey Mowing crew.
            </p>
            <div style={{ display: 'flex', gap: 28, marginTop: 30, flexWrap: 'wrap' }}>
              <div><div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 34, color: 'var(--accent-deep)' }}><CountUp to={1} prefix="" suffix="-visit" />*</div><div style={{ color: 'var(--muted)', fontWeight: 600, fontSize: 14 }}>transformations</div></div>
              <div><div style={{ fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 34, color: 'var(--accent-deep)' }}><CountUp to={100} suffix="%" /></div><div style={{ color: 'var(--muted)', fontWeight: 600, fontSize: 14 }}>happy-lawn guarantee</div></div>
            </div>
            <p style={{ marginTop: 18, fontSize: 12.5, color: 'var(--muted)' }}>*Illustrated preview — swap in your real before/after photos any time.</p>
          </div>
          <div className="ba" ref={ref} onMouseDown={start} onTouchStart={start}>
            <div className="ba-layer ba-after"><LawnArt variant="after" /></div>
            <div className="ba-layer ba-before" style={{ clipPath: `inset(0 ${100 - pct}% 0 0)` }}><LawnArt variant="before" /></div>
            <span className="ba-badge before">Before</span>
            <span className="ba-badge after">After</span>
            <div className="ba-handle" style={{ left: pct + '%' }}>
              <div className="ba-knob"><I.arrow style={{ width: 16, transform: 'scaleX(-1)' }} /><I.arrow style={{ width: 16, marginLeft: -4 }} /></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

  const points = [
    { ic: 'bolt', t: 'Quiet, all-electric fleet', d: 'No fumes, no gas-mower roar at 7am. Better for your kids, pets and the Front Range air.' },
    { ic: 'heart', t: 'Local & owner-operated', d: 'We live here too. You get the same friendly faces every visit — not a rotating crew of strangers.' },

  ];
  return (
    <section className="section bg-paper" id="about">
      <div className="wrap">
        <div className="about-grid">
          <div className="about-media reveal">
            <div className="about-card">
              <img src="project/assets/logo-transparent.png" alt="Monkey Mowing" />
            </div>
            <div className="about-quote">"They treat my yard like it's <span>their own backyard.</span>"</div>
          </div>
          <div className="reveal reveal-d1">
            <span className="eyebrow">Our story</span>
            <h2 style={{ fontSize: 'clamp(32px,4.6vw,52px)', marginTop: 16 }}>A little cheeky.<br/>Seriously good at grass.</h2>
            <p style={{ marginTop: 18, color: 'var(--muted)', fontSize: 18, lineHeight: 1.6 }}>
              Monkey Mowing started with one mower, one trailer and a simple promise: show up, do great work, and make lawn care actually pleasant. Today we keep yards across Highlands Ranch looking sharp all year — with electric equipment and a crew that genuinely cares.
            </p>
            <div className="about-points">
              {points.map((p, i) => {
                const Icon = I[p.ic];
                return (
                  <div className="about-point" key={i}>
                    <div className="ic"><Icon /></div>
                    <div><h4>{p.t}</h4><p>{p.d}</p></div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

  { q: 'How much does it cost?', a: "Most weekly or bi-weekly mows land between $39 and $89 per visit depending on lawn size and what you need. Use the instant estimator above for a ballpark, then we confirm a flat price with a free on-site quote." },
  { q: 'Are quotes really free?', a: "Always. We'll look at your lawn, talk through what you want, and give you an honest flat price with zero obligation and zero pressure." },
  { q: 'Is the equipment really all-electric?', a: "Yep. Our mowers and trimmers are battery-powered — that means no fumes, far less noise, and a smaller footprint on the air your family breathes." },
  { q: 'Do I need to be home for service?', a: "Nope. Once we have access to the yard, we handle everything and send a quick note when we're done. Recurring plans just run on autopilot." },
  { q: 'What about snow in winter?', a: "Our Estate and add-on plans include driveway and walkway snow removal, so the same crew that mows your lawn keeps you dug out all winter." },
];

      <div className="wrap">

            <h2 style={{ fontSize: 'clamp(32px,4.6vw,50px)', marginTop: 16 }}>Questions,<br/>answered.</h2>

              Still curious about something? Give us a shout — real humans answer the phone.
            </p>
            <a className="btn btn-dark" style={{ marginTop: 26 }} href="tel:303-957-7700"><I.phone /> 303-957-7700</a>
          </div>
          <div className="faq-list">
            {FAQS.map((f, i) => (
              <div className={cx('faq-item', open === i && 'open')} key={i}>
                <button className="faq-q" onClick={() => setOpen(open === i ? -1 : i)} aria-expanded={open === i}>
                  {f.q}<span className="faq-ic"><I.plus /></span>
                </button>
                <div className="faq-a" style={{ maxHeight: open === i ? 260 : 0 }}>
                  <div className="faq-a-inner">{f.a}</div>

            ))}
          </div>

</script>

<script type="text/babel">
/* contact, nav, footer */
const NAV_LINKS = [
  { href: '#services', label: 'Services' },
  { href: '#estimator', label: 'Estimate' },
  { href: '#pricing', label: 'Pricing' },
  { href: '#about', label: 'About' },
  { href: '#faq', label: 'FAQ' },
];

function Nav() {
  const [scrolled, setScrolled] = useState(false);
  const [menu, setMenu] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 30);
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  useEffect(() => { document.body.style.overflow = menu ? 'hidden' : ''; }, [menu]);
  return (
    <React.Fragment>
      <nav className={cx('nav', scrolled && 'scrolled')}>
        <div className="wrap nav-inner">
          <a className="nav-logo" href="#top"><img src="project/assets/logo-transparent.png" alt="Monkey Mowing" /></a>
          <div className="nav-links">
            {NAV_LINKS.map(l => <a key={l.href} href={l.href}>{l.label}</a>)}
          </div>
          <div className="nav-cta">
            <a className="nav-phone" href="tel:303-957-7700"><I.phone /> 303-957-7700</a>
            <a className="btn btn-primary" href="#quote" style={{ padding: '12px 22px', fontSize: 15.5 }}>Free quote</a>
            <button className="nav-burger" onClick={() => setMenu(true)} aria-label="Menu"><I.menu /></button>
          </div>
        </div>
      </nav>
      <div className={cx('msheet', menu && 'open')}>
        <div className="msheet-bg" onClick={() => setMenu(false)} />
        <div className="msheet-panel">
          <div className="msheet-top">
            <img src="project/assets/logo-transparent.png" alt="Monkey Mowing" style={{ height: 40 }} />
            <button className="nav-burger" onClick={() => setMenu(false)} aria-label="Close"><I.x /></button>
          </div>
          {NAV_LINKS.map(l => <a key={l.href} href={l.href} onClick={() => setMenu(false)}>{l.label}</a>)}
          <a href="#quote" onClick={() => setMenu(false)} style={{ color: 'var(--accent-deep)' }}>Get a free quote →</a>
          <a className="btn btn-dark" href="tel:303-957-7700" style={{ marginTop: 14, justifyContent: 'center' }}><I.phone /> 303-957-7700</a>
        </div>
      </div>
    </React.Fragment>
  );
}

const SERVICE_OPTS = ['Mowing & edging', 'Fertilizing', 'Mulching', 'Snow removal', 'Not sure yet'];

function QuoteForm() {
  const [form, setForm] = useState({ name: '', phone: '', email: '', address: '', message: '' });
  const [services, setServices] = useState(['Mowing & edging']);
  const [errors, setErrors] = useState({});
  const [touched, setTouched] = useState({});
  const [sent, setSent] = useState(false);
  const validate = (f) => {
    const e = {};
    if (!f.name.trim()) e.name = 'Please tell us your name';
    if (!f.phone.trim()) e.phone = 'We need a number to reach you';
    else if (f.phone.replace(/\D/g, '').length < 10) e.phone = "That doesn't look like a full number";
    if (!f.email.trim()) e.email = 'An email helps us send your quote';
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = 'Hmm, check that email address';
    return e;
  };
  const set = (k, v) => {
    const next = { ...form, [k]: v };
    setForm(next);
    if (touched[k]) setErrors(validate(next));
  };
  const blur = (k) => { setTouched({ ...touched, [k]: true }); setErrors(validate(form)); };
  const toggleSvc = (s) => setServices(p => p.includes(s) ? p.filter(x => x !== s) : [...p, s]);
  const submit = (e) => {
    e.preventDefault();
    const errs = validate(form);
    setErrors(errs);
    setTouched({ name: true, phone: true, email: true });
    if (Object.keys(errs).length === 0) setSent(true);
  };
  const fieldClass = (k) => cx('fr', errors[k] && touched[k] && 'err');
  return (
    <section className="section quote" id="quote">
      <div className="float bob" style={{ top: '12%', right: '6%', color: 'rgba(255,255,255,.07)' }}><I.leaf style={{ width: 120, height: 120 }} /></div>
      <div className="wrap">
        <div className="quote-grid">
          <div className="reveal">
            <span className="eyebrow" style={{ color: 'var(--lime-300)' }}>Free, no-pressure quote</span>
            <h2>Let's get your<br/>lawn looking great.</h2>
            <p className="lead">Tell us a little about your yard and we'll get back to you — usually within a day — with a friendly, flat-rate quote.</p>
            <div className="quote-contacts">
              <a className="qc" href="tel:303-957-7700">
                <div className="ic"><I.phone /></div>
                <div><small>Call or text</small><b>303-957-7700</b></div>
              </a>
              <a className="qc" href="mailto:sales@monkeymowing.com">
                <div className="ic"><I.mail /></div>
                <div><small>Email us</small><b>sales@monkeymowing.com</b></div>
              </a>
              <div className="qc">
                <div className="ic"><I.pin /></div>
                <div><small>Service area</small><b>Highlands Ranch &amp; nearby</b></div>
              </div>
            </div>
          </div>
          <div className="form-card reveal reveal-d1">
            {sent ? (
              <div className="form-success">
                <div className="check"><I.leafCheck /></div>
                <h3>Quote request sent! 🌱</h3>
                <p>Thanks, {form.name.split(' ')[0] || 'friend'}! Our crew will reach out within 24 hours at {form.phone || 'your number'}. Keep an eye on your phone.</p>
                <button className="btn btn-ghost" style={{ marginTop: 24 }} onClick={() => { setSent(false); setForm({ name:'', phone:'', email:'', address:'', message:'' }); setServices(['Mowing & edging']); setTouched({}); setErrors({}); }}>Send another</button>
              </div>
            ) : (
              <form onSubmit={submit} noValidate>
                <div className="fr-2">
                  <div className={fieldClass('name')}>
                    <label>Name <span className="req">*</span></label>
                    <input value={form.name} onChange={e => set('name', e.target.value)} onBlur={() => blur('name')} placeholder="Jane Banana" />
                    <div className="msg">{errors.name}</div>
                  </div>
                  <div className={fieldClass('phone')}>
                    <label>Phone <span className="req">*</span></label>
                    <input value={form.phone} onChange={e => set('phone', e.target.value)} onBlur={() => blur('phone')} placeholder="(303) 555-0199" inputMode="tel" />
                    <div className="msg">{errors.phone}</div>
                  </div>
                </div>
                <div className={fieldClass('email')}>
                  <label>Email <span className="req">*</span></label>
                  <input value={form.email} onChange={e => set('email', e.target.value)} onBlur={() => blur('email')} placeholder="jane@email.com" inputMode="email" />
                  <div className="msg">{errors.email}</div>
                </div>
                <div className="fr">
                  <label>Property address <span style={{ color: 'var(--muted)', fontWeight: 600 }}>(optional)</span></label>
                  <input value={form.address} onChange={e => set('address', e.target.value)} placeholder="Street, Highlands Ranch" />
                </div>
                <div className="fr">
                  <label>What do you need?</label>
                  <div className="chips">
                    {SERVICE_OPTS.map(s => (
                      <button type="button" key={s} className={cx('chip', services.includes(s) && 'on')} onClick={() => toggleSvc(s)}>
                        <I.check /> {s}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="fr">
                  <label>Anything else? <span style={{ color: 'var(--muted)', fontWeight: 600 }}>(optional)</span></label>
                  <textarea value={form.message} onChange={e => set('message', e.target.value)} placeholder="Gate code, dog in the yard, problem spots..." />
                </div>
                <button type="submit" className="btn btn-primary btn-lg form-submit">Send my free quote <I.arrow /></button>
              </form>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="footer">
      <div className="wrap">
        <div className="footer-grid">
          <div>
            <img className="fl" src="project/assets/logo-light.png" alt="Monkey Mowing" />
            <p className="fdesc">Friendly, all-electric lawn care for Highlands Ranch and the neighborhoods around it. Mow less, monkey around more.</p>
          </div>
          <div>
            <h5>Services</h5>
            <ul>
              <li><a href="#services">Mowing &amp; edging</a></li>
              <li><a href="#services">Fertilizing</a></li>
              <li><a href="#services">Mulching</a></li>
              <li><a href="#services">Snow removal</a></li>
            </ul>
          </div>
          <div>
            <h5>Company</h5>
            <ul>
              <li><a href="#about">About us</a></li>
              <li><a href="#pricing">Pricing</a></li>
              <li><a href="#faq">FAQ</a></li>
              <li><a href="#quote">Free quote</a></li>
            </ul>
          </div>
          <div>
            <h5>Get in touch</h5>
            <ul>
              <li><a href="tel:303-957-7700">303-957-7700</a></li>
              <li><a href="mailto:sales@monkeymowing.com">sales@monkeymowing.com</a></li>
              <li><a href="#quote">Highlands Ranch, CO</a></li>
            </ul>
            <div className="footer-social" style={{ marginTop: 18 }}>
              <a href="#quote" aria-label="Facebook"><I.fb /></a>
              <a href="#quote" aria-label="Instagram"><I.ig /></a>
            </div>
          </div>
        </div>
        <div className="footer-bottom">
          <span>© {new Date().getFullYear()} Monkey Mowing. All rights reserved.</span>
          <span>Made with 🍌 in Highlands Ranch, Colorado</span>
        </div>
      </div>
    </footer>
  );
}
</script>

<script type="text/babel">
/* app root */
const { useState: useS, useEffect: useE } = React;

function App() {
  const [dir, setDir] = useS('sunny');
  const [headline, setHeadline] = useS('Lawn care that goes *bananas*.');
  const [play, setPlay] = useS('playful');
  const [accent, setAccent] = useS('#54be1f');
  const [fonts, setFonts] = useS('fredoka');

  useRevealObserver();

  useE(() => {
    const root = document.documentElement;
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-deep', `color-mix(in oklab, ${accent}, #06210a 34%)`);
    root.setAttribute('data-fonts', fonts);
  }, [accent, fonts]);

  return (
    <React.Fragment>
      <Nav />
      <main>
        <Hero dir={dir} setDir={setDir} headline={headline} play={play} />
        <Stats />
        <Services />
        <Estimator />
        <Process />
        <Pricing />
        <BeforeAfter />
        <About />
        <FAQ />
        <QuoteForm />
      </main>
      <Footer />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
